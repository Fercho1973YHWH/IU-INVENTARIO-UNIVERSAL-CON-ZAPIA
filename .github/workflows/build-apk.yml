name: Publicar APK de prueba93 verificada
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba93
          run-id: 44294231012
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar APK exacta y publicar prueba aislada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba93.apk'
          python3 - <<'PY'
          import zipfile,hashlib
          z=zipfile.ZipFile('apk/IU prueba93.apk'); assert z.testzip() is None
          s=z.read('assets/public/index.html').decode()
          for x in ['Resumen general', 'Con tarjeta', 'summaryCloseBtn', 'renderStock();renderWarehouse();', 'IU · v1.13.07 (prueba)']:
              assert x in s, x
          assert b'com.iuinventario.universal.tarjetaresumenprueba' in z.read('resources.arsc')
          print('SHA256',hashlib.sha256(open('apk/IU prueba93.apk','rb').read()).hexdigest())
          PY
          gh release create 'iu-prueba93-descarga' 'apk/IU prueba93.apk#IU prueba93.apk' --target d29cf60ef6ed8a528b88f6dd487a51983f09b9c2 --title 'IU prueba93 (prueba separada)' --notes 'Prueba aislada: tarjeta, resumen unificado y botón flotante. No reemplaza la app estable.' --prerelease --latest=false
