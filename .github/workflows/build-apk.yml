name: Verificar APK prueba108
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba108
          run-id: 44444313525
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar código exacto y APK aislada
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/d4460e5e601337e34b360d29411f146208f4236f/www/index.html' -o expected.html
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/d4460e5e601337e34b360d29411f146208f4236f/www/app-icon.png' -o expected-icon.png
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('apk/IU prueba108.apk');assert p.is_file()
          print('APK SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          with ZipFile(p) as z:
              assert z.testzip() is None
              data=z.read('assets/public/index.html');assert data==Path('expected.html').read_bytes()
              assert z.read('assets/public/app-icon.png')==Path('expected-icon.png').read_bytes()
              text=data.decode()
              for item in ["scheduleResumeRefresh", "window.addEventListener('pageshow'", "nativeAppPlugin?.addListener('appStateChange'", "await load();"]:
                  assert item in text,item
              assert b'com.iuinventario.universal.reanudacion' in z.read('resources.arsc')
              print('PASS exact source/icon, resume handlers, isolated application id')
          PY
