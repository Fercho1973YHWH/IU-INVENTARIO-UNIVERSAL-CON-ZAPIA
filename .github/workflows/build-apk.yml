name: Recuperar APK de prueba93
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba93
          run-id: 44294231012
          github-token: ${{ github.token }}
          path: apk
      - name: Transferir archivo verificado
        run: |
          set -euo pipefail
          echo '9eca9873e67eabb372d51595437efa4ed7414e0ba9b78a6a1c4ed5696cb61a95  apk/IU prueba93.apk' | sha256sum -c -
          curl --fail --show-error --max-time 150 -X POST --data-binary '@apk/IU prueba93.apk' 'https://filebin.net/iu-prueba93-fercho-k2u5c9/IU.prueba93.apk'
