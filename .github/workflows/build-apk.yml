name: Verificar APK de prueba96
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba96
          run-id: 44311263537
          github-token: ${{ github.token }}
          path: apk
      - name: Validar APK y resumen solicitado
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/9feabff770adbad200e28118ff3d7424c52a5a00/www/index.html' -o original.html
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('apk/IU prueba96.apk'); assert p.is_file()
          print('APK SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          with ZipFile(p) as z:
              assert z.testzip() is None
              data=z.read('assets/public/index.html')
              assert data==Path('original.html').read_bytes(), 'HTML differs from approved test source'
              s=data.decode()
              a=s.index('function openSummaryModal(){'); b=s.index("$('summaryToggle').onclick",a); part=s[a:b]
              for v in ['Total compras','Otros gastos','Productos con bajo stock','Total costo a surtir','Productos con bajo Stock','low.after(restock)',"addGroup('Stock',clone)"]:
                  assert v in part,v
              assert "['Otros Gastos','expensesView']" not in part
              assert b'com.iuinventario.universal.tarjetaresumenprueba' in z.read('resources.arsc')
              print('PASS exact HTML, isolated appId, summary changes and APK integrity')
          PY
