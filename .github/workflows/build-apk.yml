name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba76 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba76
          run-id: 43976228934
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba76.apk'
          gh release create 'iu-prueba76-descarga' 'apk/IU prueba76.apk#IU prueba76.apk' \
            --target prueba-alinear-fecha-hora --title 'IU prueba76 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
