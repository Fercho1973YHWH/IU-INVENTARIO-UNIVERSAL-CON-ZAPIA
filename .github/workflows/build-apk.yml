name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba49 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba49
          run-id: 43731841034
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba49.apk'
          gh release create 'iu-prueba49-descarga' 'apk/IU prueba49.apk#IU prueba49.apk' \
            --target prueba-gestionar-reportes --title 'IU prueba49 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
