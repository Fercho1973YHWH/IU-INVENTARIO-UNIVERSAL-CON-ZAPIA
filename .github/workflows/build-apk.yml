name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba78 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba78
          run-id: 43993363010
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba78.apk'
          gh release create 'iu-prueba78-descarga' 'apk/IU prueba78.apk#IU prueba78.apk' \
            --target prueba-decimales-cuentas-avisos --title 'IU prueba78 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
