name: Verificar prueba98
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba98
          run-id: 44332370588
          github-token: ${{ github.token }}
          path: apk
      - name: Comprobar APK exacta
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/761d8da878892e12c0d70acb7289afbb3666cec3/www/index.html' -o expected.html
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/761d8da878892e12c0d70acb7289afbb3666cec3/www/app-icon.png' -o expected-icon.png
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('apk/IU prueba98.apk'); assert p.is_file()
          print('APK SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          with ZipFile(p) as z:
              assert z.testzip() is None
              html=z.read('assets/public/index.html');assert html==Path('expected.html').read_bytes()
              assert z.read('assets/public/app-icon.png')==Path('expected-icon.png').read_bytes()
              s=html.decode()
              for part in ['Caja(s):','warehouse-box-edit-buttons','promptSharedPassword','Borrar contraseña guardada','Crear copia cifrada con contraseña','backup-warning-icon']:
                  assert part in s,part
              assert b'com.iuinventario.universal.tarjetaresumenprueba' in z.read('resources.arsc')
              print('PASS exact source, icon, changes, isolated appId and APK integrity')
          PY
