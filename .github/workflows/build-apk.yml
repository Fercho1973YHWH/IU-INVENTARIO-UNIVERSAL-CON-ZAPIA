name: Publicar compilacion estable verificada
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK estable verificada
        uses: actions/download-artifact@v4
        with:
          name: IU estable86
          run-id: 44180005598
          github-token: ${{ github.token }}
          path: apk
      - name: Publicar APK en entrega aislada para verificar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU.estable86.apk'
          gh release create 'iu-estable-1-13-06' 'apk/IU.estable86.apk#IU.estable86.apk' \
            --target 5f4a27bc90d8bd23ec5c5ee11d53de31c6b16844 \
            --title 'IU Inventario estable 1.13.06' --prerelease --latest=false \
            --notes 'Actualización estable basada en IU prueba84 aprobada, con imagen nueva. No desinstales ni borres los datos.'
