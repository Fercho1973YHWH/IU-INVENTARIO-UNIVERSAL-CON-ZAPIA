name: Verificar APK prueba103
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba103
          run-id: 44391695843
          github-token: ${{ github.token }}
          path: apk
      - name: Comprobar APK, funciones e icono
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/246fe0cc82d97173bd7b85198aa7ceec150b94f3/www/app-icon.png' -o expected-icon.png
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('apk/IU prueba103.apk');assert p.is_file()
          print('APK SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          with ZipFile(p) as z:
              assert z.testzip() is None
              s=z.read('assets/public/index.html').decode()
              assert z.read('assets/public/app-icon.png')==Path('expected-icon.png').read_bytes()
              for item in ['payment-summary-stat',"methods=['Efectivo','Transferencia','Con tarjeta']",'Cantidad en cada caja','Cantidad total en caja(s)','Falta(n) para Stock mínimo:']:
                  assert item in s,item
              assert b'com.iuinventario.universal.resumenpagosstock' in z.read('resources.arsc')
              print('PASS: artifact intact, icon matches, requested summaries/cards present, isolated package id')
          PY
