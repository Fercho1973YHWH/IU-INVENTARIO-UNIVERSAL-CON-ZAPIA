name: Compilar IU Prueba 128
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias y generar Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_NAME="1.13.17"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i "s/IU · v1.13.16 (prueba)/IU · v$VERSION_NAME (prueba)/g" www/index.html
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import re, subprocess
          source=Path("www/index.html").read_text()
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", source, re.S)
          assert scripts and "saveStockPriority" in source and "warehouseEditQuantity" in source
          assert "purchasePriority" in source and "Valor anterior" in source and "calcTitle" in source
          assert "grossProfitMonth" in source and "monthPayablePayments" in source
          assert "reportIncludePriority" in source and "reportIncludeBoxes" in source and "reportIncludeSection" in source
          assert "reportIncludeDetails" not in source
          assert "priorityRow.classList.toggle('hidden',stockFilter!=='low'" in source
          assert "automaticStockPriority" in source
          assert "extraPercent<10)return 'alta';if(extraPercent<=50)return 'media';return 'baja'" in source
          assert "purchasePriorityManual===true" in source and "option value=\"auto\">Automática" in source
          assert "Prioridad calculada automáticamente" not in source
          assert "stockWithinPriorityBand" in source and "prioritySelect.onchange=()=>saveStockPriority" in source
          assert "stock-minimum" in source and "En cajas:" in source and "<b class=\"stock-number\"></b>" not in source
          assert "#salesList .details,#purchaseList .details,#list .details" in source
          assert "IU · v1.13.17 (prueba)" in source
          assert "IU Inventario · v1.13.17 (prueba)" in source
          assert "CASH_DAYS='cashDays',menus=" in source and "indexedDB.open(DB,6)" in source
          assert "keyPath:'date'" in source and "cashDays:'date'" in source
          assert "function cashDayBreakdown(date,record)" in source
          assert "function saveCashOpening()" in source and "function addCashMovement()" in source and "function saveCashClose()" in source
          assert "Informes guardados por día" in source and "report={...values,counted,savedAt:" in source
          assert "informes diarios de caja" in source and "raw.stores[CASH_DAYS]=[]" in source
          assert "visibleReportExportSnapshot" in source
          assert "$('reportXlsx').onclick=()=>{const {headers,rows}=visibleReportExportSnapshot()" in source
          assert "$('reportHtml').onclick=()=>{const {headers,rows}=visibleReportExportSnapshot()" in source
          assert "$('reportCsv').onclick=()=>{const {headers,rows}=visibleReportExportSnapshot()" in source
          assert "$('reportPrint').onclick=()=>{const {headers,rows}=visibleReportExportSnapshot()" in source
          assert "reportExportDocumentHtml(headers,rows)" in source
          assert "reportDetailExportRows()" not in source[source.index("$('reportXlsx').onclick="):source.index("$('reportType').onchange=")]
          assert "monthPayableAbonos(month)" in source
          assert "function monthPayableAbonos(month){return supplierMovements.filter(m=>(m.accountType||'payable')==='payable'&&String(m.date||'').slice(0,7)===month&&Number(m.amount)<0)" in source
          assert "grossProfitMonth').textContent=money(monthGross-monthPayablePayments)" in source
          assert "grid-template-columns:minmax(0,1fr) minmax(185px,200px)" in source
          assert "max-width:200px" in source and "width:100%;min-width:0;min-height:38px" in source
          assert source.index("<b>Stock mínimo:</b>") < source.index("<b>Stock actual:</b>")
          assert "IU_FIREBASE_CONFIG" not in source and "activationRequests" not in source
          Path("/tmp/iu-script-check.js").write_text(max(scripts,key=len))
          subprocess.run(["node","--check","/tmp/iu-script-check.js"],check=True)
          PYVERIFY
          npm install
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/iuinventario/universal/estable
          cp BarcodeScannerPlugin.java android/app/src/main/java/com/iuinventario/universal/estable/BarcodeScannerPlugin.java
          cp EmailSharePlugin.java android/app/src/main/java/com/iuinventario/universal/estable/EmailSharePlugin.java
          cp BackupPasswordVaultPlugin.java android/app/src/main/java/com/iuinventario/universal/estable/BackupPasswordVaultPlugin.java
          python3 - <<'PYDEPS'
          from pathlib import Path
          p=Path("android/app/build.gradle")
          s=p.read_text()
          deps="\n    implementation 'androidx.camera:camera-camera2:1.4.2'\n    implementation 'androidx.camera:camera-lifecycle:1.4.2'\n    implementation 'androidx.camera:camera-view:1.4.2'\n    implementation 'com.google.mlkit:barcode-scanning:17.3.0'\n"
          if "com.google.mlkit:barcode-scanning" not in s:
              s=s.replace("dependencies {", "dependencies {"+deps, 1)
          assert "androidx.camera:camera-camera2:1.4.2" in s and "com.google.mlkit:barcode-scanning:17.3.0" in s
          p.write_text(s)
          PYDEPS
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/java/com/iuinventario/universal/estable
          cp ExportFilePlugin.java android/app/src/main/java/com/iuinventario/universal/estable/ExportFilePlugin.java
          python3 - <<'PYPLUGIN'
          from pathlib import Path
          import re
          candidates=list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          assert len(candidates)==1, "No se encontró MainActivity"
          p=candidates[0]
          s=p.read_text()
          if "registerPlugin(ExportFilePlugin.class)" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.iuinventario.universal.estable.ExportFilePlugin;")
              s=re.sub(r"public class MainActivity extends BridgeActivity \{", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(ExportFilePlugin.class);\n        super.onCreate(savedInstanceState);\n    }", s, count=1)
          if "BarcodeScannerPlugin.class" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.iuinventario.universal.estable.BarcodeScannerPlugin;")
              s=s.replace("registerPlugin(ExportFilePlugin.class);", "registerPlugin(ExportFilePlugin.class);\n        registerPlugin(BarcodeScannerPlugin.class);")
          if "EmailSharePlugin.class" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.iuinventario.universal.estable.EmailSharePlugin;")
              s=s.replace("registerPlugin(ExportFilePlugin.class);", "registerPlugin(ExportFilePlugin.class);\n        registerPlugin(EmailSharePlugin.class);")
          if "BackupPasswordVaultPlugin.class" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.iuinventario.universal.estable.BackupPasswordVaultPlugin;")
              s=s.replace("registerPlugin(ExportFilePlugin.class);", "registerPlugin(ExportFilePlugin.class);\n        registerPlugin(BackupPasswordVaultPlugin.class);")
          assert "registerPlugin(ExportFilePlugin.class)" in s, "No se pudo registrar ExportFile"
          assert "registerPlugin(BarcodeScannerPlugin.class)" in s, "No se pudo registrar BarcodeScanner"
          assert "registerPlugin(EmailSharePlugin.class)" in s, "No se pudo registrar EmailShare"
          assert "registerPlugin(BackupPasswordVaultPlugin.class)" in s, "No se pudo registrar BackupPasswordVault"
          p.write_text(s)
          PYPLUGIN
          cp www/app-icon.png android/app/src/main/res/drawable-nodpi/iu_launcher.png
          python3 - <<'PYMAN'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"', '', s)
          s=s.replace('<application', '<application android:icon="@drawable/iu_launcher" android:roundIcon="@drawable/iu_launcher"', 1)
          s=s.replace('<application', '<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><application', 1)
          provider='''<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>'''
          if 'androidx.core.content.FileProvider' not in s:
              s=s.replace('</application>', provider+'</application>', 1)
          if 'com.google.android.gm' not in s:
              s=s.replace('<application', '<queries><package android:name="com.google.android.gm" /></queries><application', 1)
          p.write_text(s)
          paths=Path("android/app/src/main/res/xml/file_paths.xml")
          paths.parent.mkdir(parents=True,exist_ok=True)
          if not paths.exists():
              paths.write_text('<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><external-path name="my_images" path="." /><cache-path name="my_cache_images" path="." /></paths>')
          else:
              xml=paths.read_text()
              if '<cache-path' not in xml:
                  assert '</paths>' in xml
                  paths.write_text(xml.replace('</paths>', '<cache-path name="iu_cache" path="." /></paths>'))
          PYMAN
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Compilar APK sin firmar
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep "versionName \"$VERSION_NAME\"" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Firmar y verificar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD"
          KEYFILE="$RUNNER_TEMP/iu-keystore.p12"
          printf '%s' "$KEYSTORE" | base64 -d > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          INPUT=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -f -p 4 "$INPUT" "$RUNNER_TEMP/iu-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYFILE" --ks-type PKCS12 --ks-key-alias iuinventario --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out "IU prueba${VERSION_CODE}.apk" "$RUNNER_TEMP/iu-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "IU prueba${VERSION_CODE}.apk"
          "$TOOLS/aapt" dump badging "IU prueba${VERSION_CODE}.apk" | grep -F "package: name='com.iuinventario.universal.reportefix128'"
          "$TOOLS/aapt" dump badging "IU prueba${VERSION_CODE}.apk" | grep -F "versionName='1.13.17'"
          python3 - <<'PYAPK'
          from zipfile import ZipFile
          from pathlib import Path
          apk=Path(f"IU prueba{__import__('os').environ['VERSION_CODE']}.apk")
          with ZipFile(apk) as z:
              html=z.read("assets/public/index.html").decode()
              assert "warehouseEditQuantity" in html and "purchasePriority" in html
              assert "Valor anterior" in html and "calcTitle" in html
              assert "grossProfitMonth" in html and "monthPayablePayments" in html
              assert "reportIncludePriority" in html and "reportIncludeBoxes" in html and "reportIncludeSection" in html
              assert "reportIncludeDetails" not in html
              assert "automaticStockPriority" in html
              assert "extraPercent<10)return 'alta';if(extraPercent<=50)return 'media';return 'baja'" in html
              assert "purchasePriorityManual===true" in html and "option value=\"auto\">Automática" in html
              assert "stockWithinPriorityBand" in html and "prioritySelect.onchange=()=>saveStockPriority" in html
              assert "stock-minimum" in html and "En cajas:" in html and "<b class=\"stock-number\"></b>" not in html
              assert "#salesList .details,#purchaseList .details,#list .details" in html
              assert "IU · v1.13.17 (prueba)" in html
              assert "IU Inventario · v1.13.17 (prueba)" in html
              assert "cashDayBreakdown" in html and "saveCashClose" in html and "cashDays" in html
              assert "visibleReportExportSnapshot" in html
              assert "function monthPayableAbonos(month)" in html
              assert "monthPayablePayments=monthPayableAbonos(month)" in html
              assert "reportPrint').onclick=()=>{const {headers,rows}=visibleReportExportSnapshot()" in html
              assert "grid-template-columns:minmax(0,1fr) minmax(185px,200px)" in html
              assert "max-width:200px" in html
              assert html.index("<b>Stock mínimo:</b>") < html.index("<b>Stock actual:</b>")
              assert "IU_FIREBASE_CONFIG" not in html and "activationRequests" not in html
          print("APK contains requested features and no Firebase authorization code")
          PYAPK
      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: IU prueba${{ github.run_number }}
          path: IU prueba${{ github.run_number }}.apk
          if-no-files-found: error
