name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba65 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba65
          run-id: 43884422632
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba65.apk'
          gh release create 'iu-prueba65-descarga' 'apk/IU prueba65.apk#IU prueba65.apk' \
            --target prueba-fechas-icono --title 'IU prueba65 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
