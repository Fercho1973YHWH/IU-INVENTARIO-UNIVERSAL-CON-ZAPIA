name: Verificar prueba101
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba101
          run-id: 44362558496
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar APK final y recursos
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/8bbbb7bf774de742bbe66b80b9af7c956f52a975/www/index.html' -o expected.html
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/8bbbb7bf774de742bbe66b80b9af7c956f52a975/www/app-icon.png' -o expected-icon.png
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('apk/IU prueba101.apk');assert p.is_file()
          print('APK SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          with ZipFile(p) as z:
              assert z.testzip() is None
              html=z.read('assets/public/index.html');assert html==Path('expected.html').read_bytes()
              assert z.read('assets/public/app-icon.png')==Path('expected-icon.png').read_bytes()
              s=html.decode()
              for part in ['function keywordMatch','function parseDisplayNumber','record-card sale-record','record-card purchase-record','Modo de pago:</b> <span class="payment"']:
                  assert part in s,part
              assert b'com.iuinventario.universal.busquedapago' in z.read('resources.arsc')
              print('PASS exact source, icon, grouped numeric inputs, keyword search and isolated appId')
          PY
