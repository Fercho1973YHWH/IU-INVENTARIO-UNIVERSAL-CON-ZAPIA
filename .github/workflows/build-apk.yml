name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba72 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba72
          run-id: 43966859448
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba72.apk'
          gh release create 'iu-prueba72-descarga' 'apk/IU prueba72.apk#IU prueba72.apk' \
            --target prueba-recordatorios-flexibles --title 'IU prueba72 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
