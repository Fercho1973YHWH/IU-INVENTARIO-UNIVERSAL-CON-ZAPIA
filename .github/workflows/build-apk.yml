name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba67 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba67
          run-id: 43934340615
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba67.apk'
          gh release create 'iu-prueba67-descarga' 'apk/IU prueba67.apk#IU prueba67.apk' \
            --target prueba-respaldo-integral --title 'IU prueba67 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
