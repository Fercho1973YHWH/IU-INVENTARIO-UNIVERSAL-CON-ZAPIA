name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias y generar Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # Actualizar esta versión únicamente al preparar una nueva versión estable.
          # Las compilaciones de prueba no alteran la secuencia de versiones estables.
          VERSION_NAME="1.13.07"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i "s/IU · v1.3.0/IU · v$VERSION_NAME/g; s/IU Inventario · v1.3.0/IU Inventario · v$VERSION_NAME/g" www/index.html
          npm install
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/java/com/iuinventario/universal/estable
          cp ExportFilePlugin.java android/app/src/main/java/com/iuinventario/universal/estable/ExportFilePlugin.java
          python3 - <<'PYPLUGIN'
          from pathlib import Path
          import re
          candidates=list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          assert len(candidates)==1, "No se encontró MainActivity"
          p=candidates[0]
          s=p.read_text()
          if "registerPlugin(ExportFilePlugin.class)" not in s:
              s=s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport com.iuinventario.universal.estable.ExportFilePlugin;")
              s=re.sub(r"public class MainActivity extends BridgeActivity \{", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(ExportFilePlugin.class);\n        super.onCreate(savedInstanceState);\n    }", s, count=1)
          assert "registerPlugin(ExportFilePlugin.class)" in s, "No se pudo registrar ExportFile"
          p.write_text(s)
          print(s)
          PYPLUGIN
          cp www/app-icon.png android/app/src/main/res/drawable-nodpi/iu_launcher.png
          python3 - <<'PYMAN'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"', '', s)
          s=s.replace('<application', '<application android:icon="@drawable/iu_launcher" android:roundIcon="@drawable/iu_launcher"', 1)
          s=s.replace('<application', '<uses-permission android:name="android.permission.CAMERA"/><application', 1)
          p.write_text(s)
          PYMAN
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Compilar APK sin firmar
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep "versionCode $VERSION_CODE" android/app/build.gradle
          grep "versionName \"$VERSION_NAME\"" android/app/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Firmar y verificar APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD"
          KEYFILE="$RUNNER_TEMP/iu-keystore.p12"
          printf '%s' "$KEYSTORE" | base64 -d > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          INPUT=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -f -p 4 "$INPUT" "$RUNNER_TEMP/iu-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYFILE" --ks-type PKCS12 --ks-key-alias iuinventario --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out IU-Inventario-Estable.apk "$RUNNER_TEMP/iu-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs IU-Inventario-Estable.apk
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IU-Inventario-Estable
          path: IU-Inventario-Estable.apk
          if-no-files-found: error
