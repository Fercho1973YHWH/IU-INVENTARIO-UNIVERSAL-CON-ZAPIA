name: Verificar APK prueba106
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IU prueba106
          run-id: 44423483870
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenidos exactos
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/d7e3e80885487b0be7426b7ecded932d53f59aef/www/index.html' -o expected.html
          curl -fsSL 'https://raw.githubusercontent.com/Fercho1973YHWH/IU-INVENTARIO-UNIVERSAL-CON-ZAPIA/d7e3e80885487b0be7426b7ecded932d53f59aef/www/app-icon.png' -o expected-icon.png
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('apk/IU prueba106.apk');assert p.is_file()
          print('APK SHA256:',hashlib.sha256(p.read_bytes()).hexdigest())
          with ZipFile(p) as z:
              assert z.testzip() is None
              data=z.read('assets/public/index.html');assert data==Path('expected.html').read_bytes()
              assert z.read('assets/public/app-icon.png')==Path('expected-icon.png').read_bytes()
              s=data.decode()
              for part in ['Sale de Bodega:', 'sale-allocations', 'Resumen de ${currentModule}', 'summaryModalContent']:
                  assert part in s,part
              assert b'com.iuinventario.universal.ventasumenseparado' in z.read('resources.arsc')
              print('PASS exact source, icon, requested changes, isolated package id')
          PY
