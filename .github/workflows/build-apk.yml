name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba80 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba80
          run-id: 44091160018
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba80.apk'
          gh release create 'iu-prueba80-descarga' 'apk/IU prueba80.apk#IU prueba80.apk' \
            --target prueba-ventas-recordatorio-orden --title 'IU prueba80 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
