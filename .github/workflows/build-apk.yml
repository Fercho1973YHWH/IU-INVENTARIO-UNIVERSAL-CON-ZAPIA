name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba70 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba70
          run-id: 43945517290
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba70.apk'
          gh release create 'iu-prueba70-descarga' 'apk/IU prueba70.apk#IU prueba70.apk' \
            --target prueba-respaldo-cifrado-recordatorio --title 'IU prueba70 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
