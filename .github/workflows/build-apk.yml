name: Compilar IU Prototipo A
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar proyecto Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_NAME="1.14.00"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          npm install
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/iuinventario/universal/estable
          cp BarcodeScannerPlugin.java android/app/src/main/java/com/iuinventario/universal/estable/BarcodeScannerPlugin.java
          cp EmailSharePlugin.java android/app/src/main/java/com/iuinventario/universal/estable/EmailSharePlugin.java
          cp BackupPasswordVaultPlugin.java android/app/src/main/java/com/iuinventario/universal/estable/BackupPasswordVaultPlugin.java
          cp ExportFilePlugin.java android/app/src/main/java/com/iuinventario/universal/estable/ExportFilePlugin.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          deps="\n    implementation 'androidx.camera:camera-camera2:1.4.2'\n    implementation 'androidx.camera:camera-lifecycle:1.4.2'\n    implementation 'androidx.camera:camera-view:1.4.2'\n    implementation 'com.google.mlkit:barcode-scanning:17.3.0'\n"
          if "com.google.mlkit:barcode-scanning" not in s:
              s=s.replace("dependencies {", "dependencies {"+deps, 1)
          assert "com.google.mlkit:barcode-scanning:17.3.0" in s
          p.write_text(s)
          import json
          cfg=json.loads(Path("capacitor.config.json").read_text())
          package=cfg["appId"]
          java_dir=Path("android/app/src/main/java")/Path(*package.split("."))
          java_dir.mkdir(parents=True,exist_ok=True)
          activity=java_dir/"MainActivity.java"
          activity.write_text("\n".join([
              f"package {package};",
              "import android.os.Bundle;",
              "import com.getcapacitor.BridgeActivity;",
              "import com.iuinventario.universal.estable.ExportFilePlugin;",
              "import com.iuinventario.universal.estable.BarcodeScannerPlugin;",
              "import com.iuinventario.universal.estable.EmailSharePlugin;",
              "import com.iuinventario.universal.estable.BackupPasswordVaultPlugin;",
              "public class MainActivity extends BridgeActivity {",
              "    @Override",
              "    public void onCreate(Bundle savedInstanceState) {",
              "        registerPlugin(ExportFilePlugin.class);",
              "        registerPlugin(BarcodeScannerPlugin.class);",
              "        registerPlugin(EmailSharePlugin.class);",
              "        registerPlugin(BackupPasswordVaultPlugin.class);",
              "        super.onCreate(savedInstanceState);",
              "    }",
              "}",
          ])+"\n")
          check=activity.read_text()
          assert all(f"registerPlugin({name}.class)" in check for name in ["ExportFilePlugin","BarcodeScannerPlugin","EmailSharePlugin","BackupPasswordVaultPlugin"])
          icon=Path("www/app-icon.png")
          assert icon.exists()
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          m=manifest.read_text()
          m=re.sub(r'\s+android:(?:icon|roundIcon)="[^"]*"','',m)
          m=m.replace('<application','<application android:icon="@drawable/iu_launcher" android:roundIcon="@drawable/iu_launcher"',1)
          manifest.write_text(m)
          res=Path("android/app/src/main/res/drawable-nodpi")
          res.mkdir(parents=True,exist_ok=True)
          (res/'iu_launcher.png').write_bytes(icon.read_bytes())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Build isolated test APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 26/' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" android/app/build.gradle
          python3 - <<'PYVER'
          from pathlib import Path
          import os, re
          p=Path("android/app/build.gradle")
          s=p.read_text()
          s,n=re.subn(r'versionName\s+"[^"]+"', f'versionName "{os.environ["VERSION_NAME"]}"', s, count=1)
          assert n == 1, "No se pudo establecer la versión Android"
          p.write_text(s)
          assert f'versionName "{os.environ["VERSION_NAME"]}"' in s
          PYVER
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign and verify isolated test APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD"
          KEYFILE="$RUNNER_TEMP/iu-test-keystore.p12"
          printf '%s' "$KEYSTORE" | base64 -d > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          INPUT=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -f -p 4 "$INPUT" "$RUNNER_TEMP/iu-protoA-aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYFILE" --ks-type PKCS12 --ks-key-alias iuinventario --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out "IU INVENTARIO UNIVERSAL - Prototipo A.apk" "$RUNNER_TEMP/iu-protoA-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "IU INVENTARIO UNIVERSAL - Prototipo A.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: IU Prototipo A
          path: IU INVENTARIO UNIVERSAL - Prototipo A.apk
          if-no-files-found: error
