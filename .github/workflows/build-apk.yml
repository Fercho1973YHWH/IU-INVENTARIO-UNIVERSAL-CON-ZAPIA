name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba82 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba82
          run-id: 44114600875
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba82.apk'
          gh release create 'iu-prueba82-descarga' 'apk/IU prueba82.apk#IU prueba82.apk' \
            --target prueba-correo-cifrado --title 'IU prueba82 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
