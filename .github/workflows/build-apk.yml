name: Verificar y compartir estable 1.13.05
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar estable anterior
        uses: actions/download-artifact@v4
        with:
          name: IU-Inventario-Estable
          run-id: 43433223728
          github-token: ${{ github.token }}
          path: old
      - name: Descargar estable candidata
        uses: actions/download-artifact@v4
        with:
          name: IU-Inventario-Estable
          run-id: 43788955856
          github-token: ${{ github.token }}
          path: new
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
      - name: Verificar identidad, firma, versiones y contenido
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OLD='old/IU-Inventario-Estable.apk'
          NEW='new/IU-Inventario-Estable.apk'
          test -f "$OLD" && test -f "$NEW"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs "$OLD" > "$RUNNER_TEMP/old-signature.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$NEW" > "$RUNNER_TEMP/new-signature.txt"
          echo 'Certificado anterior:'; grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/old-signature.txt"
          echo 'Certificado candidato:'; grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/new-signature.txt"
          cmp <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/old-signature.txt") <(grep 'certificate SHA-256 digest:' "$RUNNER_TEMP/new-signature.txt")
          "$TOOLS/aapt" dump badging "$OLD" | grep '^package:' > "$RUNNER_TEMP/old-package.txt"
          "$TOOLS/aapt" dump badging "$NEW" | grep '^package:' > "$RUNNER_TEMP/new-package.txt"
          cat "$RUNNER_TEMP/old-package.txt" "$RUNNER_TEMP/new-package.txt"
          python3 - <<'PY'
          import os,re
          root=os.environ['RUNNER_TEMP']
          old=open(root+'/old-package.txt').read();new=open(root+'/new-package.txt').read()
          def get(s,k):
              m=re.search(r"\b"+k+r"='([^']+)'",s);assert m,k;return m.group(1)
          assert get(old,'name')==get(new,'name')=='com.iuinventario.universal.estable'
          assert int(get(new,'versionCode'))>int(get(old,'versionCode'))
          assert get(new,'versionName')=='1.13.05'
          print('Verificado: ID estable, versión 1.13.05 y versionCode superior.')
          PY
          cp "$NEW" 'IU estable60.apk'
          gh release create 'iu-estable-1-13-05' 'IU estable60.apk#IU estable60.apk' \
            --target ebbaf45dd5cb99f70b2e0d93007c6f6605ad5334 --title 'IU Inventario estable 1.13.05' \
            --notes 'Actualización de IU Inventario Universal estable 1.13.05, basada en IU prueba58 aprobada. No desinstalar la app ni borrar sus datos.' \
            --latest=false
