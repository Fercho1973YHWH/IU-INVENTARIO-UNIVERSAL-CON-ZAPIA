name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba74 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba74
          run-id: 43974910555
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba74.apk'
          gh release create 'iu-prueba74-descarga' 'apk/IU prueba74.apk#IU prueba74.apk' \
            --target prueba-alinear-fecha-hora --title 'IU prueba74 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
