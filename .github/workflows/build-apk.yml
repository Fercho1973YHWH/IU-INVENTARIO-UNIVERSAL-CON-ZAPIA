name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba84 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba84
          run-id: 44130731584
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba84.apk'
          gh release create 'iu-prueba84-descarga' 'apk/IU prueba84.apk#IU prueba84.apk' \
            --target prueba-aviso-gmail-seguro --title 'IU prueba84 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
