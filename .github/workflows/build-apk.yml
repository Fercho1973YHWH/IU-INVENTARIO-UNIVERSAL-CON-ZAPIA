name: Compartir APK de prueba existente
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK de prueba63 existente
        uses: actions/download-artifact@v4
        with:
          name: IU prueba63
          run-id: 43869516065
          github-token: ${{ github.token }}
          path: apk
      - name: Verificar contenido y publicar solo como prueba
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f 'apk/IU prueba63.apk'
          gh release create 'iu-prueba63-descarga' 'apk/IU prueba63.apk#IU prueba63.apk' \
            --target prueba-bodega-cuentas-fechas --title 'IU prueba63 (prueba aislada)' \
            --notes 'APK de prueba aislada; no es una versión estable. Conserva la app estable y sus datos.' \
            --prerelease --latest=false
