name: Recuperar APK compilada
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  recuperar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK verificada
        uses: actions/download-artifact@v4
        with:
          name: IU estable86
          run-id: 44180005598
          github-token: ${{ github.token }}
          path: apk
      - name: Preparar descarga temporal de la APK
        run: |
          set -euo pipefail
          test -f apk/IU.estable86.apk
          sha256sum apk/IU.estable86.apk
          gzip -c apk/IU.estable86.apk > /tmp/iu-payload.gz
          curl -fsS --retry 2 --max-time 120 --upload-file /tmp/iu-payload.gz 'https://transfer.whalebone.io/iu-payload.gz'
